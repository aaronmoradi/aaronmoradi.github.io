    .shout.on { opacity: 1; transform: scale(1); }
    .page-404 .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

<body data-egg="lost">

  <main class="page-center page-404">
    <div class="wrap" style="width:100%">
      <span class="eyebrow">Error 404</span>
      <h1>Air <em>ball.</em></h1>
      <p>This page doesn't exist. But the hoop does. Drag back from the ball, aim, and let go. Hit 5 in a row and something good happens.</p>

      <div class="court">
        <canvas id="hoops" aria-label="Basketball mini-game: drag back from the ball and release to shoot"></canvas>
        <div class="hud"><span>score <b id="score">0</b></span><span>streak <b id="streak">0</b></span><span>best <b id="best">0</b></span></div>
        <div class="shout" id="shout">Swish!</div>
      </div>

      </div>

  <script src="/js/main.js"></script>
  <script>
  (() => {
    const cv = document.getElementById('hoops');
    const ctx = cv.getContext('2d');
    const $score = document.getElementById('score'), $streak = document.getElementById('streak'), $best = document.getElementById('best'), $shout = document.getElementById('shout');
    const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    let W = 0, H = 0;
    const R = 15, G = 0.38, RIM_W = 64, RIM_R = 4;
    let hoop = { x: 0, y: 0 };            // x = backboard face, y = rim height
    let ball, drag = null, inFlight = false, shotTime = 0, scoredThisShot = false;
    let score = 0, streak = 0, best = Number(AM.store.get('am_hoops_best', 0)) || 0;
    $best.textContent = best;

    function resize() {
      const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
      W = r.width; H = r.height;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      placeHoop(true);
      resetBall();
    }
    function placeHoop(initial) {
      hoop.x = W - Math.max(28, W * 0.06);
      hoop.y = initial ? H * 0.38 : H * (0.25 + Math.random() * 0.3);
    }
    function resetBall() {
      const startX = Math.max(60, W * (0.1 + Math.random() * 0.2));
      ball = { x: startX, y: H - R - 30, vx: 0, vy: 0, spin: 0, home: { x: startX, y: H - R - 30 } };
      inFlight = false; scoredThisShot = false;
    }
    const rimFront = () => ({ x: hoop.x - RIM_W, y: hoop.y });
    const rimBack = () => ({ x: hoop.x - 2, y: hoop.y });

    function collidePoint(p) {
      const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
      if (d < R + RIM_R && d > 0) {
        const nx = dx / d, ny = dy / d, dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) { ball.vx -= 1.75 * dot * nx; ball.vy -= 1.75 * dot * ny; }
        ball.x = p.x + nx * (R + RIM_R); ball.y = p.y + ny * (R + RIM_R);
      }
    }

    function physics() {
      const prevY = ball.y;
      ball.vy += G; ball.x += ball.vx; ball.y += ball.vy; ball.spin += ball.vx * 0.05;
      collidePoint(rimFront()); collidePoint(rimBack());
      // backboard
      const top = hoop.y - 90, bottom = hoop.y + 14;
      if (ball.x + R > hoop.x && ball.x < hoop.x + 10 && ball.y > top && ball.y < bottom && ball.vx > 0) { ball.x = hoop.x - R; ball.vx *= -0.6; }
      // floor + left wall
      if (ball.y + R > H) { ball.y = H - R; ball.vy *= -0.55; ball.vx *= 0.8; }
      if (ball.x - R < 0) { ball.x = R; ball.vx *= -0.6; }
      // score: center passes down through the rim
      const f = rimFront();
      if (!scoredThisShot && prevY < hoop.y && ball.y >= hoop.y && ball.x > f.x + R * 0.4 && ball.x < hoop.x - R * 0.4) {
        scoredThisShot = true; onScore();
      }
      const done = (Math.abs(ball.vy) < 0.8 && ball.y + R >= H - 1 && Math.abs(ball.vx) < 0.4) || ball.x - R > W || performance.now() - shotTime > 6000;
      if (done) endShot();
    }

    function shout(text) {
      $shout.textContent = text; $shout.classList.add('on');
      clearTimeout(shout.t); shout.t = setTimeout(() => $shout.classList.remove('on'), 900);
    }
    function onScore() {
      score++; streak++;
      $score.textContent = score; $streak.textContent = streak;
      if (streak > best) { best = streak; AM.store.set('am_hoops_best', best); $best.textContent = best; }
      shout(['Swish!', 'Buckets!', 'Count it!', 'Kobe!', 'Splash!'][Math.min(streak - 1, 4)]);
      if (streak === 5) { AM.findEgg('hoops'); AM.confetti('lakers', 200); }
      else AM.confetti('party', 24);
    }
    function endShot() {
      if (!scoredThisShot) { if (streak > 0) shout('Brick.'); streak = 0; $streak.textContent = 0; }
      else placeHoop(false);
      resetBall();
    }

    function predict(vx, vy) {
      const pts = []; let x = ball.x, y = ball.y;
      for (let i = 0; i < 26; i++) { vy += G; x += vx; y += vy; if (i % 2) pts.push([x, y]); }
      return pts;
    }

    function draw() {
      const ink = css('--ink'), accent = css('--accent'), line = css('--line'), muted = css('--muted');
      ctx.clearRect(0, 0, W, H);
      // floor
      ctx.fillStyle = line; ctx.fillRect(0, H - 4, W, 4);
      // 3pt-ish arc
      ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hoop.x, H, W * 0.55, Math.PI, Math.PI * 1.5); ctx.stroke();
      // pole + board
      ctx.fillStyle = muted; ctx.fillRect(hoop.x + 8, hoop.y - 40, 6, H);
      ctx.fillStyle = ink; ctx.fillRect(hoop.x, hoop.y - 90, 8, 104);
      // net
      const f = rimFront();
      ctx.strokeStyle = muted; ctx.lineWidth = 1.2; ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const x0 = f.x + (RIM_W * i) / 4, x1 = f.x + RIM_W * 0.2 + (RIM_W * 0.6 * i) / 4;
        ctx.moveTo(x0, hoop.y); ctx.lineTo(x1, hoop.y + 42);
      }
      ctx.moveTo(f.x + 6, hoop.y + 14); ctx.lineTo(hoop.x - 6, hoop.y + 14);
      ctx.moveTo(f.x + 10, hoop.y + 28); ctx.lineTo(hoop.x - 10, hoop.y + 28);
      ctx.stroke();
      // aim preview
      if (drag) {
        const v = shotVel(); ctx.fillStyle = muted;
        predict(v.vx, v.vy).forEach(([x, y], i) => { ctx.globalAlpha = 1 - i / 14; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); });
        ctx.globalAlpha = 1;
      }
      // ball
      ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.spin);
      ctx.fillStyle = '#f2541b'; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
      ctx.strokeStyle = '#1a0d06'; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.moveTo(0, -R); ctx.lineTo(0, R);
      ctx.moveTo(-R * 0.7, -R * 0.7); ctx.quadraticCurveTo(0, 0, -R * 0.7, R * 0.7);
      ctx.moveTo(R * 0.7, -R * 0.7); ctx.quadraticCurveTo(0, 0, R * 0.7, R * 0.7);
      ctx.stroke(); ctx.restore();
      // rim on top of ball for depth
      ctx.strokeStyle = accent; ctx.lineWidth = RIM_R * 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(f.x, hoop.y); ctx.lineTo(hoop.x, hoop.y); ctx.stroke();
      if (!inFlight && !drag && score === 0) {
        ctx.fillStyle = muted; ctx.font = '12px JetBrains Mono, monospace';
        ctx.fillText('← drag back, release to shoot', ball.x + R + 10, ball.y + 4);
      }
    }

    function shotVel() {
      const dx = drag.sx - drag.x, dy = drag.sy - drag.y, k = 0.13, max = 22;
      let vx = dx * k, vy = dy * k; const m = Math.hypot(vx, vy);
      if (m > max) { vx *= max / m; vy *= max / m; }
      return { vx, vy };
    }
    const pt = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.addEventListener('pointerdown', (e) => {
      if (inFlight) return;
      const p = pt(e); drag = { sx: p.x, sy: p.y, x: p.x, y: p.y };
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', (e) => { if (drag) { const p = pt(e); drag.x = p.x; drag.y = p.y; } });
    cv.addEventListener('pointerup', () => {
      if (!drag) return;
      const v = shotVel(); drag = null;
      if (Math.hypot(v.vx, v.vy) < 2) return;
      ball.vx = v.vx; ball.vy = v.vy; inFlight = true; shotTime = performance.now();
    });

    let last = performance.now(), acc = 0;
    function loop(now) {
      acc += Math.min(now - last, 100); last = now;
      while (acc >= 1000 / 60) { if (inFlight) physics(); acc -= 1000 / 60; }
      draw(); requestAnimationFrame(loop);
    }
    addEventListener('resize', resize);
    resize(); requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
